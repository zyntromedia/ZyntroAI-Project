name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.4.10"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Ruff Linter
        id: lint
        run: |
          uv run ruff check .
        continue-on-error: false

      - name: Run Ruff Formatter Check
        id: format
        run: |
          uv run ruff format --check .
        continue-on-error: false

      - name: Run mypy Type Checker
        id: types
        run: |
          uv run mypy app/ --strict
        continue-on-error: false

      - name: Run Tests with Coverage
        id: test
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
        continue-on-error: false

      - name: Run Bandit Security Scan
        id: security
        run: |
          uv run bandit -r app/ -ll
        continue-on-error: false

  # Optional: Separate jobs for better visibility
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && needs.quality-gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Ruff Linter
        run: uv run ruff check .

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && needs.quality-gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  types:
    name: Type Check
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && needs.quality-gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run mypy
        run: uv run mypy app/ --strict

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && needs.quality-gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && needs.quality-gate.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Bandit
        run: uv run bandit -r app/ -ll
