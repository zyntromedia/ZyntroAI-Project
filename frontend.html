<!DOCTYPE html>
<html>
<head><title>ZyntroAI Pong</title></head>
<body style="background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <canvas id="pongCanvas" width="800" height="600" style="border: 2px solid #00ffcc; box-shadow: 0 0 20px #00ffcc;"></canvas>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const ws = new WebSocket('ws://localhost:8000/ws/pong');

        let gameState = { ball_x: 400, ball_y: 300, paddle1_y: 250, paddle2_y: 250, score1: 0, score2: 0 };

        ws.onmessage = (event) => {
            gameState = JSON.parse(event.data);
            draw();
        };

        // ส่งตำแหน่งไม้เมื่อขยับเมาส์
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const y = e.clientY - rect.top;
            ws.send(JSON.stringify({ type: 'move', player: 1, y: y - 50 }));
        });

        function draw() {
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, 800, 600);
            
            // วาดลูกบอล
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(gameState.ball_x, gameState.ball_y, 10, 0, Math.PI * 2);
            ctx.fill();

            // วาดไม้
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(10, gameState.paddle1_y, 10, 100);
            ctx.fillRect(780, gameState.paddle2_y, 10, 100);

            // วาดคะแนน
            ctx.fillStyle = '#fff';
            ctx.font = '40px Arial';
            ctx.fillText(gameState.score1, 200, 50);
            ctx.fillText(gameState.score2, 600, 50);
        }
    </script>
</body>
</html>
